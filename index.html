<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explored — Каталог предметов</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/pixy');

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            padding: 30px 20px 60px;
            font-family: 'Pixy', 'Courier New', monospace;
            letter-spacing: 2px;
            color: #d8cff0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0612 0%, #150a28 50%, #0d0618 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== Фоновые слои ===== */
        .bg-stars-1,
        .bg-stars-2,
        .bg-mist-1,
        .bg-mist-2,
        .bg-mist-3 {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-stars-1 {
            background-image:
                radial-gradient(1px 1px at 4% 12%, #ffffff, transparent),
                radial-gradient(1px 1px at 11% 34%, #e9d5ff, transparent),
                radial-gradient(1px 1px at 18% 7%, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 24% 56%, #ffffff, transparent),
                radial-gradient(1px 1px at 31% 22%, #c4b5fd, transparent),
                radial-gradient(1px 1px at 39% 78%, #ffffff, transparent),
                radial-gradient(1px 1px at 46% 41%, #e9d5ff, transparent),
                radial-gradient(1.5px 1.5px at 54% 15%, #ffffff, transparent),
                radial-gradient(1px 1px at 61% 68%, #ffffff, transparent),
                radial-gradient(1px 1px at 68% 29%, #c4b5fd, transparent),
                radial-gradient(1px 1px at 74% 84%, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 81% 47%, #e9d5ff, transparent),
                radial-gradient(1px 1px at 88% 18%, #ffffff, transparent),
                radial-gradient(1px 1px at 94% 62%, #ffffff, transparent),
                radial-gradient(1px 1px at 7% 88%, #c4b5fd, transparent),
                radial-gradient(1px 1px at 42% 92%, #ffffff, transparent),
                radial-gradient(1px 1px at 76% 6%, #ffffff, transparent),
                radial-gradient(1px 1px at 58% 95%, #e9d5ff, transparent),
                radial-gradient(1px 1px at 2% 62%, #ffffff, transparent),
                radial-gradient(1px 1px at 14% 47%, #e9d5ff, transparent),
                radial-gradient(1px 1px at 27% 82%, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 35% 5%, #ffffff, transparent),
                radial-gradient(1px 1px at 43% 25%, #c4b5fd, transparent),
                radial-gradient(1px 1px at 57% 51%, #ffffff, transparent),
                radial-gradient(1px 1px at 64% 88%, #e9d5ff, transparent),
                radial-gradient(1px 1px at 79% 10%, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 85% 68%, #ffffff, transparent),
                radial-gradient(1px 1px at 91% 40%, #c4b5fd, transparent);
            animation: twinkle1 3s ease-in-out infinite;
        }

        .bg-stars-2 {
            background-image:
                radial-gradient(2px 2px at 15% 20%, #ffffff, transparent),
                radial-gradient(2px 2px at 33% 62%, #e9d5ff, transparent),
                radial-gradient(2px 2px at 51% 8%, #ffffff, transparent),
                radial-gradient(2px 2px at 72% 55%, #c4b5fd, transparent),
                radial-gradient(2px 2px at 87% 33%, #ffffff, transparent),
                radial-gradient(2px 2px at 26% 88%, #ffffff, transparent),
                radial-gradient(2px 2px at 63% 92%, #e9d5ff, transparent),
                radial-gradient(2px 2px at 96% 74%, #ffffff, transparent),
                radial-gradient(2px 2px at 5% 55%, #c4b5fd, transparent),
                radial-gradient(2px 2px at 45% 35%, #ffffff, transparent),
                radial-gradient(2px 2px at 9% 8%, #ffffff, transparent),
                radial-gradient(2px 2px at 22% 45%, #e9d5ff, transparent),
                radial-gradient(2px 2px at 39% 18%, #ffffff, transparent),
                radial-gradient(2px 2px at 56% 78%, #c4b5fd, transparent),
                radial-gradient(2px 2px at 68% 6%, #ffffff, transparent),
                radial-gradient(2px 2px at 82% 88%, #e9d5ff, transparent),
                radial-gradient(2px 2px at 92% 22%, #ffffff, transparent),
                radial-gradient(2px 2px at 3% 78%, #ffffff, transparent);
            animation: twinkle2 4.5s ease-in-out infinite 0.8s;
        }

        .bg-mist-1,
        .bg-mist-2,
        .bg-mist-3 {
            position: fixed;
            inset: -50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            will-change: transform;
        }

        .bg-mist-1 {
            opacity: 0.75;
            background:
                radial-gradient(circle 500px at 30% 40%, rgba(139, 92, 246, 0.55), transparent 70%),
                radial-gradient(circle 620px at 72% 60%, rgba(120, 70, 200, 0.45), transparent 70%);
            animation: mistDrift1 45s ease-in-out infinite;
        }

        .bg-mist-2 {
            opacity: 0.65;
            background:
                radial-gradient(circle 420px at 62% 28%, rgba(88, 40, 160, 0.55), transparent 70%),
                radial-gradient(circle 560px at 18% 72%, rgba(167, 139, 250, 0.40), transparent 70%);
            animation: mistDrift2 60s ease-in-out infinite;
        }

        .bg-mist-3 {
            opacity: 0.55;
            background:
                radial-gradient(circle 360px at 82% 48%, rgba(139, 92, 246, 0.40), transparent 70%),
                radial-gradient(circle 480px at 40% 88%, rgba(88, 40, 160, 0.45), transparent 70%);
            animation: mistDrift3 75s ease-in-out infinite;
        }

        @keyframes twinkle1 {
            0%, 100% { opacity: 0.25; }
            50%      { opacity: 1;    }
        }

        @keyframes twinkle2 {
            0%, 100% { opacity: 1;    }
            50%      { opacity: 0.1;  }
        }

        @keyframes mistDrift1 {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            20%  { transform: translate(6%, -4%) rotate(4deg) scale(1.10); }
            40%  { transform: translate(-4%, 5%) rotate(-3deg) scale(0.94); }
            60%  { transform: translate(5%, 6%) rotate(6deg) scale(1.12); }
            80%  { transform: translate(-6%, -3%) rotate(-4deg) scale(1.02); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        @keyframes mistDrift2 {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            25%  { transform: translate(-7%, 4%) rotate(-5deg) scale(1.14); }
            50%  { transform: translate(4%, -6%) rotate(3deg) scale(0.92); }
            75%  { transform: translate(-5%, -5%) rotate(7deg) scale(1.08); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        @keyframes mistDrift3 {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            30%  { transform: translate(8%, 3%) rotate(5deg) scale(1.16); }
            55%  { transform: translate(-3%, -7%) rotate(-6deg) scale(0.90); }
            80%  { transform: translate(3%, 6%) rotate(4deg) scale(1.06); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        /* ===== Контент поверх фона ===== */
        .header, .item-grid, .modal-overlay { position: relative; z-index: 1; }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #f0e9ff;
            letter-spacing: 14px;
            font-size: 34px;
            font-weight: 400;
            margin: 0 0 28px 0;
            text-transform: uppercase;
            text-shadow:
                0 0 12px rgba(167, 139, 250, 0.6),
                0 0 30px rgba(139, 92, 246, 0.35);
        }

        h1::before,
        h1::after {
            content: '';
            display: inline-block;
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #a78bfa, transparent);
            vertical-align: middle;
            margin: 0 20px;
        }

        #search {
            width: 90%;
            max-width: 640px;
            padding: 14px 22px;
            font-family: inherit;
            font-size: 16px;
            letter-spacing: 2px;
            color: #e9d5ff;
            background: rgba(20, 10, 40, 0.7);
            border: 1px solid rgba(167, 139, 250, 0.4);
            border-radius: 2px;
            outline: none;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        #search:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.4), inset 0 0 10px rgba(167, 139, 250, 0.1);
            background: rgba(30, 15, 55, 0.85);
        }

        #search::placeholder {
            color: #6b5b8c;
            letter-spacing: 2px;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 22px;
            border-radius: 6px;
            background: rgba(12, 6, 24, 0.35);
            backdrop-filter: blur(14px) saturate(120%);
            -webkit-backdrop-filter: blur(14px) saturate(120%);
            border: 1px solid rgba(167, 139, 250, 0.18);
            box-shadow:
                0 0 40px rgba(88, 40, 160, 0.15),
                inset 0 0 60px rgba(88, 40, 160, 0.08);
        }

        .item-icon {
            width: 63px;
            height: 63px;
            background-image: url('tilesheet.png');
            background-repeat: no-repeat;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border-radius: 4px;
            cursor: pointer;
            background-color: rgba(18, 8, 36, 0.45);
            box-shadow:
                inset 0 0 0 1px rgba(167, 139, 250, 0.15),
                0 2px 6px rgba(0, 0, 0, 0.35);
            background-size: 1260px 882px;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .item-icon:hover {
            transform: scale(1.12);
            background-color: rgba(167, 139, 250, 0.15);
            box-shadow:
                inset 0 0 0 1px #a78bfa,
                0 0 18px rgba(167, 139, 250, 0.6),
                0 0 6px rgba(94, 234, 212, 0.3);
        }

        /* ===== Модалка ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 2, 15, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-frame {
            width: 90%;
            max-width: 640px;
            padding: 12px;
            border-radius: 28px;
            background:
                radial-gradient(circle at 100% 0%, rgba(15, 20, 25, 0.95) 0%, rgba(15, 20, 25, 0.4) 20%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(15, 20, 25, 0.95) 0%, rgba(15, 20, 25, 0.4) 20%, transparent 50%),
                radial-gradient(ellipse 60% 70% at 20% 15%, #d8dce2 0%, #b4b9c1 30%, transparent 65%),
                linear-gradient(135deg, #b8bcc4 0%, #8f949c 40%, #6f7580 70%, #4e535b 100%);
            border: 1px solid #2a2f36;
            box-shadow:
                0 0 45px rgba(0, 255, 65, 0.18),
                0 22px 55px rgba(0, 0, 0, 0.7),
                inset 0 -2px 5px rgba(0, 0, 0, 0.5);
            transform: translateY(80px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
        }

        .modal-overlay.active .modal-frame {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-content {
            position: relative;
            border-radius: 18px;
            padding: 30px 34px;
            background: #0d2412;
            background-image:
                linear-gradient(180deg, rgba(0, 60, 20, 0.55), rgba(0, 20, 8, 0.85)),
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 65, 0.12) 0px,
                    rgba(0, 255, 65, 0.12) 2px,
                    transparent 2px,
                    transparent 5px
                );
            border: 1px solid rgba(0, 255, 65, 0.35);
            box-shadow:
                inset 0 0 60px rgba(0, 255, 65, 0.12),
                inset 0 0 4px rgba(0, 255, 65, 0.5);
            text-align: center;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40px;
            background: linear-gradient(180deg, rgba(0, 255, 65, 0.15), transparent);
            pointer-events: none;
        }

        /* ===== Тексты со свечением ===== */

        .modal-id {
            position: absolute;
            top: 14px;
            left: 22px;
            color: #4ade80;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 4px rgba(74, 222, 128, 0.45);
        }

        .modal-content h2 {
            margin: 0 60px 22px 60px;
            color: #86efac;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow:
                0 0 6px rgba(134, 239, 172, 0.55),
                0 0 14px rgba(134, 239, 172, 0.25);
        }

        .modal-icon {
            width: 126px;
            height: 126px;
            background-image: url('tilesheet.png');
            background-repeat: no-repeat;
            image-rendering: pixelated;
            margin: 0 auto 22px auto;
            border-radius: 4px;
            box-shadow:
                inset 0 0 0 1px rgba(0, 255, 65, 0.5),
                0 0 20px rgba(0, 255, 65, 0.4);
        }

        .modal-desc {
            color: #86efac;
            line-height: 1.75;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-align: left;
            border-top: 1px solid rgba(0, 255, 65, 0.3);
            padding-top: 20px;
            min-height: 3.5em;
            text-shadow: 0 0 3px rgba(134, 239, 172, 0.25);
            white-space: pre-wrap;
            cursor: pointer;
        }

        /* Мигающий курсор в конце печати */
        .cursor {
            display: inline-block;
            color: #86efac;
            margin-left: 2px;
            animation: cursorBlink 0.8s step-end infinite;
            text-shadow: 0 0 6px rgba(134, 239, 172, 0.7);
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 16px;
            background: none;
            border: none;
            color: #4ade80;
            font-size: 26px;
            cursor: pointer;
            line-height: 1;
            font-family: inherit;
            text-shadow: 0 0 4px rgba(74, 222, 128, 0.4);
            transition: color 0.2s, text-shadow 0.2s;
        }

        .close-btn:hover {
            color: #86efac;
            text-shadow: 0 0 14px rgba(134, 239, 172, 0.9);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #6b5b8c;
            padding: 90px 20px;
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 2;
        }

        #count {
            color: #8b7aa8;
            margin: 18px 0 25px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @media (max-width: 500px) {
            h1 { font-size: 22px; letter-spacing: 6px; }
            h1::before, h1::after { width: 16px; margin: 0 8px; }
            .modal-content { padding: 24px 20px; }
            .modal-content h2 { margin: 0 40px 18px 40px; font-size: 18px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <div class="bg-stars-1"></div>
    <div class="bg-stars-2"></div>
    <div class="bg-mist-1"></div>
    <div class="bg-mist-2"></div>
    <div class="bg-mist-3"></div>

    <div class="header">
        <h1>Предметы</h1>
        <input type="text" id="search" placeholder="Поиск по названию, описанию...">

    <div id="grid" class="item-grid"></div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-frame">
            <div class="modal-content">
                <button class="close-btn" id="close-modal">&times;</button>
                <div id="modal-id" class="modal-id">ID: 0</div>

                <div id="modal-icon" class="modal-icon"></div>
                <div id="modal-desc" class="modal-desc"></div>
            </div>
        </div>
    </div>

            { id: 34, name: "Перо феникса", desc: "Даёт 1 дополнительную жизнь. При возрождении персонаж создаёт мощный огненный взрыв. Персонаж возрождается с половиной от максимального здоровья." },
            { id: 35, name: "Маховик", desc: "Снаряды плавно ускоряются в процессе полёта." },
            { id: 36, name: "Циркуль", desc: "Повышает дальность в 2 раза. Снаряды двигаются по круговой траектории и пролетают сквозь препятствия." },
            { id: 37, name: "Транспортир", desc: "Снаряды меняют свой угол на 45 градусов в случайную сторону каждые 0.5 сек." },
            { id: 38, name: "Пневмоцилиндр", desc: "Увеличивает силу рывка персонажа в 2 раза." },
            { id: 39, name: "Красный кристалл", desc: "Повышает скорость добычи лазерным буром на 75%." },
            { id: 40, name: "Пластырь", desc: "Повышает скорость регенерации очков здоровья на 75%." },
            { id: 41, name: "Крыло летучей мыши", desc: "При попадании по существам восстанавливает здоровье, равное 50% от нанесённого урона." },
            { id: 42, name: "Пальчиковая батарейка", desc: "Расходники-батарейки дают 8 единиц щита вместо 5. Создаёт 1 батарейку." },
            { id: 43, name: "Шестерня", desc: "Повышает скорострельность построек-турелей в 2 раза." },
            { id: 44, name: "Шуруп", desc: "Повышает урон построек-турелей в 2 раза." },
            { id: 45, name: "Сверло", desc: "Снаряды пролетают сквозь существ." },
            { id: 46, name: "Песочные часы", desc: "Снижает вероятность возникновения нашествий существ на 25%." },
            { id: 47, name: "Антенна", desc: "Повышает скорострельность и урон построек-турелей на 75%. Управление турелями становится полностью ручным. Управлять можно только турелями, находящимися в пределах видимости." },
            { id: 48, name: "Анестезия", desc: "Шанс блокировать урон от любого источника. Шанс зависит от удачи." },
            { id: 49, name: "Автомобильный аккумулятор", desc: "Повышает урон от электрических искр в 3 раза." },
            { id: 50, name: "Пчелиные соты", desc: "Шанс оставить небольшой рой пчёл на месте уничтоженного существа. Шанс зависит от удачи." },
            { id: 51, name: "Гиперкуб", desc: "Шанс выстрелить в 4 направлениях. Шанс зависит от удачи." },
            { id: 52, name: "Клевер в пробирке", desc: "Повышает удачу на 3." },
            { id: 53, name: "Огнетушитель", desc: "Даёт полную невосприимчивость к эффекту горения." },
            { id: 54, name: "Антидот", desc: "Даёт полную невосприимчивость к эффекту отравления." },
            { id: 55, name: "Термокостюм", desc: "Даёт полную невосприимчивость к эффекту заморозки." },
            { id: 56, name: "Диэлектрический спрей", desc: "Даёт полную невосприимчивость к эффекту оглушения." },
            { id: 57, name: "Тёмные очки", desc: "Даёт полную невосприимчивость к эффекту ослепления." },
            { id: 58, name: "Мутаген", desc: "Шанс выстрелить липким снарядом. Прилипает к существу и лопается на несколько маленьких самонаводящихся липких снарядов в случае его гибели. Шанс зависит от удачи." },
            { id: 59, name: "Ядро сингулярности", desc: "Снаряды поглощают снаряды существ и мгновенно выстреливают мини-снарядами в ответ." },
            { id: 60, name: "Игрушечный пистолет", desc: "Шанс выстрелить снарядом, оснащённым турелью. Турель стреляет по направлению курсора, полностью копируя атаку игрока. Шанс зависит от удачи." },
            { id: 61, name: "Пульт управления", desc: "Снаряды наводятся в направлении курсора." },
            { id: 62, name: "Эхо-детонатор", desc: "Шанс повторного ослабленного взрыва на месте любого взрыва, созданного персонажем или оружием. Шанс зависит от удачи." },
            { id: 63, name: "Протекающая канистра", desc: "Персонаж оставляет за собой след из жидкости при передвижении." },
            { id: 64, name: "Тяжёлая кувалда", desc: "Шанс выстрелить усиленным в 3 раза медленным снарядом. Шанс зависит от удачи." },
            { id: 65, name: "Якорь", desc: "Повышает: скорострельность на 30%, урон на 20%. При удержании кнопки стрельбы выпущенные снаряды будут стоять на месте, но не дольше 5 сек." },
            { id: 66, name: "Мощный конденсатор", desc: "Снаряды постепенно накапливаются, если не вести стрельбу. При стрельбе оружие выпускает множество снарядов и уменьшает накопленный заряд." },
            { id: 67, name: "Голографический проектор", desc: "Шанс создать голографическую копию персонажа на месте уничтоженного снаряда. Голограмма отвлекает ближайших существ на себя и наносит контактный урон. Шанс зависит от удачи." },
            { id: 68, name: "Старый обрез", desc: "Добавляет 4 дополнительных снаряда. Снижает: урон на 25%, скорострельность в 2 раза, дальность на 60%. Повышает разброс на 40 градусов." },
            { id: 69, name: "Патронташ", desc: "Повышает скорострельность в 4 раза, снижает урон на 70%. Позволяет стрелять сверх лимита перегрева оружия, но при его превышении персонаж начнёт гореть." },
            { id: 70, name: "Плазменный сгусток", desc: "Повышает: урон в 4 раза, скорость снарядов в 2.5 раза. Снижает скорострельность на 70%. Значительно повышает воздействие отдачи на персонажа." },
            { id: 71, name: "Игральный кубик", desc: "Даёт 2 дополнительные замены, повышает удачу на 1." },
            { id: 72, name: "Пороховой картридж", desc: "Рывок создаёт за персонажем взрывы." },
            { id: 73, name: "Стимулятор", desc: "Повышает скорость ходьбы и бега персонажа на 30%, снижает максимальный запас здоровья на 20%." },
            { id: 74, name: "Заострённый кристалл", desc: "Повышает урон на 75%, снижает максимальный запас здоровья на 25%." },
            { id: 75, name: "Еда для космонавтов", desc: "Повышает максимальный запас здоровья на 50%, снижает скорость ходьбы и бега персонажа на 20%." },
            { id: 76, name: "Набор картриджей", desc: "Создаёт 8 случайных картриджей." },
            { id: 77, name: "Конвертер", desc: "Преобразует все эффекты картриджей в положительные. Создаёт 1 случайный картридж." },
            { id: 78, name: "Фантомный глаз", desc: "Снаряды создают взрывы при контакте с препятствиями и пролетают их насквозь." },
            { id: 79, name: "Семена клевера", desc: "Повышает удачу на 1. Далее каждый выбранный предмет дополнительно будет повышать удачу на 0.5." },
            { id: 80, name: "Реактивный ускоритель", desc: "Повышает: скорострельность в 3 раза, урон на 25%. Отзеркаливает направление атаки и значительно повышает воздействие отдачи на персонажа." },
            { id: 81, name: "Булава", desc: "При получении урона персонаж выстреливает мини-снарядами в 12 направлениях." },
            { id: 82, name: "Бинокль", desc: "Добавляет 1 дополнительный снаряд. Повышает: дальность на 50%, разброс на 20 градусов." },
            { id: 83, name: "Оптический прицел", desc: "Повышает: дальность в 2 раза, скорость снарядов на 75%. При попадании в существо совершается дополнительный выстрел самонаводящимся мини-снарядом." },
            { id: 84, name: "Микросхема", desc: "Немного повышает все характеристики." },
            { id: 85, name: "Металлоискатель", desc: "Повышает шанс найти картридж при добыче ресурсов, даёт шанс получить больше ресурсов за одну добычу." },
            { id: 86, name: "Электрошокер", desc: "Шанс оставить на месте уничтоженного существа электрошокер. Электрошокер запускает электрические разряды в ближайшие цели. Шанс зависит от удачи." },
            { id: 87, name: "Маска хирурга", desc: "Даёт шанс получить больше хитиноплазмы с уничтоженных существ. При уничтожении существ есть шанс получить картридж, но не больше 3 за вылазку." },
            { id: 88, name: "Изотоник", desc: "Повышает скорость ходьбы и бега персонажа на 10%, снижает воздействие веса двуручных предметов на 50%." },
            { id: 89, name: "Гаечный ключ", desc: "Снижает цену восстановления построек и взаимодействия с интерактивными объектами в 2 раза. В начале каждой последующей вылазки даёт 10 хлама." },
            { id: 90, name: "Проклятый амулет", desc: "Повышает урон в 4.5 раза, полностью убирает перегрев оружия. При уничтожении существа создаёт на его месте враждебного призрака." },
            { id: 91, name: "Резонирующие осколки", desc: "Шанс выстрелить 1-5 дополнительных снарядов в случайном направлении. Шанс зависит от удачи." },
            { id: 92, name: "Хрустальный клевер", desc: "Повышает удачу на 10. Каждое получение урона отнимает 0.5 от этого бонуса, но не чаще, чем раз в 2 сек." },
            { id: 93, name: "Мантия иллюзиониста", desc: "Рывок создаёт на месте персонажа голографическую копию, отвлекающую внимание ближайших существ на себя. Копия быстро исчезает." },
            { id: 94, name: "Катана ниндзя", desc: "Рывок создаёт пронзающую атаку, наносящую урон всем попавшим под неё существам." },
            { id: 95, name: "Маска пчеловода", desc: "Усиливает дружелюбных пчёл в 2 раза. Снижает урон, наносимый враждебными пчёлами на 30%. Позволяет пчеле-отшельнице игнорировать персонажа." },
            { id: 96, name: "Наковальня", desc: "Повышает урон на 75%, снижает скорость снарядов в 2 раза." },
            { id: 97, name: "Кубик льда", desc: "Продлевает лимит перегрева оружия на 5 сек. При контакте с персонажем существа замораживаются." },
            { id: 98, name: "Портативный навигатор", desc: "Повышает дальность в 2 раза, снижает скорость снарядов на 30%, снаряды самонаводятся." },
            { id: 99, name: "Осколочная граната", desc: "Любой взрыв, созданный персонажем или оружием, дополнительно распадается на 3-6 осколков в случайном направлении." },
            { id: 100, name: "Факел", desc: "При контакте с персонажем существа загораются и ослепляются." },
            { id: 101, name: "Башня Теслы", desc: "Персонаж запускает электрические разряды в ближайшие цели." },
            { id: 102, name: "Тяжёлый модем", desc: "Повышает: урон в 3 раза, дальность в 3.5 раза. Снижает: скорость снарядов на 40%, скорострельность в 5 раз. Снаряды наводятся в направлении курсора, пролетают сквозь препятствия и существ." },
            { id: 103, name: "Электроулей", desc: "Добавляет 4 дополнительных снаряда. Повышает: дальность в 2 раза, разброс на 40 градусов. Снижает: урон на 70%, скорость снарядов на 30%, скорострельность в 2 раза. Снаряды самонаводятся и пролетают сквозь существ." },
            { id: 104, name: "Шар для боулинга", desc: "Повышает: дальность на 50%, урон на 75%. Снаряды постепенно замедляются и отскакивают от препятствий. При столкновении друг с другом снаряды взрываются." },
            { id: 105, name: "Хрустальная пуля", desc: "При уничтожении снаряды распадаются на 2-5 мини-снарядов в случайном направлении." },
            { id: 106, name: "Кибер-сердце", desc: "Снижает максимальный запас здоровья на 90%. Взамен даёт быстро восстанавливаемый щит, в размере 50% от максимального здоровья, которое было у персонажа ранее." },
            { id: 107, name: "Антиматерия", desc: "Незначительный шанс выстрелить антиматериальным снарядом. Антиматериальный снаряд мгновенно поражает любые уничтожаемые цели. Шанс зависит от удачи. Снижает удачу на 1." },
            { id: 108, name: "Фейерверк", desc: "Снижает скорострельность на 30%. Снаряды постепенно замедляются. К каждому снаряду могут применяться случайные эффекты. При уничтожении снаряды распадаются на 8 мини-снарядов." },
            { id: 109, name: "RGB лента", desc: "Повышает скорострельность на 75%, снижает урон на 60%. К каждому снаряду могут применяться случайные эффекты." },
            { id: 110, name: "Циркулярная пила", desc: "Снижает скорострельность в 2 раза. Добавляет 3 орбитальных мини-снаряда, очень быстро вращающихся вокруг основного. Снаряды пролетают сквозь существ." },
            { id: 111, name: "Нано-пистолеты", desc: "Уничтоженное существо выстреливает ослабленной атакой персонажа в сторону другого ближайшего существа." },
            { id: 112, name: "Тротилловая инъекция", desc: "Уничтоженное существо создаёт после себя мощный взрыв." },
            { id: 113, name: "Жидкий азот", desc: "Полностью убирает перегрев оружия. При стрельбе есть шанс, что персонаж заморозит сам себя." },
            { id: 114, name: "Сконцентрированная кислота", desc: "Шанс выстрелить капсулой с кислотой. Поражённое капсулой существо начнёт бесконечно истекать жидкостью, пока не погибнет. Шанс зависит от удачи." },
            { id: 115, name: "Стволовые клетки", desc: "Снижает максимальный запас здоровья на 30%. Далее каждый выбранный предмет дополнительно будет повышать максимальный запас здоровья на 15%." },
            { id: 116, name: "Квазар", desc: "Добавляет дополнительную заряжаемую атаку лазером с неограниченной дальностью. Заряд накапливается в процессе стрельбы." },
            { id: 117, name: "Монтировка", desc: "Первое попадание по существу наносит в 2 раза больше урона." },
            { id: 118, name: "Неисправный экзоскелет", desc: "Снижает скорость ходьбы и бега на 40%. Повышает максимальный запас здоровья на 500 единиц. Не даёт здоровью повышаться и блокирует регенерацию. Враждебные турели больше не атакуют персонажа." },
            { id: 119, name: "Нитроглицерин", desc: "Делает все жидкости, созданные персонажем или оружием взрывными." },
            { id: 120, name: "Золотая подкова", desc: "Повышает: удачу на 2, скорость ходьбы и бега персонажа на 10%." },
            { id: 121, name: "Сгнивший клевер", desc: "Снижает удачу на 3. Умеренно повышает все остальные характеристики." },
            { id: 122, name: "Громкоговоритель", desc: "Повышает урон на 75%. Персонаж говорит громче и может привлекать внимание существ." },
            { id: 123, name: "Фонарик", desc: "Персонаж светит фонариком, если у него не выбран никакой инструмент. Существа, находящиеся в области света ослепляются." },
            { id: 124, name: "Железные лёгкие", desc: "Бесконечная выносливость. Персонаж больше не может бегать, но рывок остаётся. Увеличивает силу рывка персонажа на 50%. Позволяет делать рывок с двуручным предметом." },
            { id: 125, name: "Инопланетное яйцо", desc: "Шанс выстрелить яйцом. Мгновенно уничтожает существо и создаёт на его месте его уменьшенную в 2 раза копию. Уменьшенную копию можно раздавить. Шанс зависит от удачи." },
            { id: 126, name: "Медная монета", desc: "Даёт 1 дополнительную замену, повышает удачу на 2." },
            { id: 127, name: "Ржавый люк", desc: "Увеличивает размер и хитбокс жидкостей в 3 раза." },
            { id: 128, name: "Плоская отвёртка", desc: "Повышает урон и скорострельность на 0.3." },
            { id: 129, name: "Сверхновая", desc: "Незначительный шанс оставить лучи в 8 направлениях с неограниченной дистанцией на месте любого взрыва, созданного персонажем или оружием. Шанс зависит от удачи." },
            { id: 130, name: "Балахон мага", desc: "Усиливает эффекты от всех стихий, накладываемых на существ." },
            { id: 131, name: "Гнутый гвоздь", desc: "Повышает скорострельность на 30%, снаряды пролетают сквозь существ и двигаются по волнистой траектории." },
            { id: 132, name: "Нестабильный терминал", desc: "Повышает количетсво опыта, получаемое за миссии в 2 раза. Снижает количество вариантов выбора предметов до одного." },
            { id: 133, name: "Большая красная кнопка", desc: "Даёт возможность улететь с планеты/луны до выполнения миссий 1 раз за забег." },
            { id: 134, name: "Русская рулетка", desc: "Повышает урон в 2.5 раза. В персонажа постоянно целится револьвер, который может выстрелить вместе с ним всегда с шансом 1/6. Урон выстрела револьвера зависит от урона игрока." },
            { id: 135, name: "Машинное масло", desc: "Повышает скорострельность на 75%. Персонаж замедляется плавно и скользит." },
            { id: 136, name: "Мусорное ведро", desc: "Каждая утилизация выбора предметов даёт 3 одноразовых замены." },
            { id: 137, name: "Дьявольский кубик", desc: "Даёт возможность продолжать замены после того, как они израсходуются. Каждая замена отнимет у персонажа 10 единиц максимального запаса здоровья." },
            { id: 138, name: "Сосулька", desc: "Снижает урон на 30%. Снаряды пролетают сквозь существ и всегда имеют замораживающий эффект." },
            { id: 139, name: "Дух шахтёра", desc: "Повышает скорость добычи лазерным буром в 5 раз. Каждый добытый камень взрывается и создаёт на своём месте враждебного призрака." },
            { id: 140, name: "Коробок спичек", desc: "Шанс оставить на месте уничтоженного снаряда горящую спичку. Спичка поджигает существ при контакте и затухает через 5 сек. Шанс зависит от удачи." },
            { id: 141, name: "Бабушкин пылесос", desc: "При сборе органики дополнительно восстанавливает 15 очков здоровья. Позволяет уничтожать призраков при помощи сборщика органики. Сборщик органики работает громче и может привлекать внимание существ." },
            { id: 142, name: "Каменный щит", desc: "Каждый добытый камень даёт 5 единиц щита, но не выше 25. Щит постепенно угасает." },
            { id: 143, name: "Хитиновый панцирь", desc: "Каждое уничтоженное существо даёт 5 единиц щита, но не выше 25. Щит постепенно угасает." },
            { id: 144, name: "Шляпа фокусника", desc: "Позволяет совершать выстрелы из точки, где находится курсор, а не из оружия." },
            { id: 145, name: "Окаменевший клевер", desc: "Повышает удачу на 1. Не даёт удаче снижаться." },
            { id: 146, name: "Лимонный сок", desc: "При получении урона персонаж создаёт большую лужу жидкости." },
            { id: 147, name: "Стеклянный кубик", desc: "Даёт 10 одноразовых замен." },
            { id: 148, name: "Дефибриллятор", desc: "Если здоровье персонажа опускается ниже 20 очков, даёт 25 единиц щита. Щит постепенно угасает. Срабатывает не чаще, чем раз в минуту." },
            { id: 149, name: "Мясо", desc: "Повышает: максимальный запас здоровья на 15%, скорость регенерации очков здоровья на 50%." },
            { id: 150, name: "Шпатель", desc: "Снижает урон в 2 раза. Добавляет 2 дополнительных снаряда. Снаряды выстреливаются горизонтальными рядами. Расстояние между снарядами зависит от разброса." },
            { id: 151, name: "Кирпич", desc: "Повышает прочность баррикад в 3 раза." },
            { id: 152, name: "Пороховая бочка", desc: "Увеличивает размер и хитбокс взрывов в 3 раза." },
            { id: 153, name: "Магический шар", desc: "Существа находящиеся под воздействием любой стихии получают на 50% больше урона от оружия." },
            { id: 154, name: "Усилитель", desc: "Удваивает эффекты картриджей. Создаёт 1 случайный картридж." },
            { id: 155, name: "Микроскоп", desc: "Увеличивает размер и хитбокс мини-снарядов в 5 раз." },
            { id: 156, name: "Пояс астероидов", desc: "Добавляет вращающееся вокруг персонажа кольцо из 5 камней. Камни блокируют вражеские снаряды и наносят контактный урон." },
            { id: 157, name: "Синдром Туретта", desc: "Во время стрельбы персонаж может перестать двигаться и стрелять. Спустя короткое время персонаж начинает быстро стрелять вокруг себя на протяжении 3 сек." },
            { id: 158, name: "Отравленный кинжал", desc: "Снижает максимальный запас здоровья на 30%. Снаряды пролетают сквозь существ и всегда имеют отравляющий эффект. Усиливает отравляющий эффект, накладываемый на существ." },
            { id: 159, name: "Повышение", desc: "Заполняет шкалу опыта в начале каждой последующей вылазки." },
            { id: 160, name: "Грибной дождь", desc: "Каждые 0.5 сек в случайном месте неподалёку от персонажа создаётся лужа жидкости." },
            { id: 161, name: "Окаменевшая пуля", desc: "Не даёт урону снижаться." },
            { id: 162, name: "Инопланетное оружие", desc: "Во время стрельбы персонаж периодически выстреливает лазером. К лазеру могут применяться случайные эффекты." },
            { id: 163, name: "Огнемёт", desc: "Заменяет снаряды на ближнюю атаку шквальным огнём, проходящую сквозь препятствия и существ. Атака всегда имеет поджигающий эффект." },
            { id: 164, name: "Золотая пуля", desc: "Повышает: урон на 30%, удачу на 2." },
            { id: 165, name: "Хрупкие крылья", desc: "Повышает скорость бега персонажа на 60%. Не влияет на скорость ходьбы. Снижает максимальную выносливость на 2 единицы." },
            { id: 166, name: "Хлыст", desc: "Повышает скорость снарядов на 50%. Шанс выстрелить пронзающей атакой параллельно с основной. Шанс зависит от удачи." },
            { id: 167, name: "Обсидиановый рог", desc: "Персонаж ускоряется плавно. При максимально возможной скорости персонаж становится неуязвимым и наносит контактный урон." },
            { id: 168, name: "Сломанная пружина", desc: "Повышает скорострельность на 75%. При стрельбе скорострельность немного варьируется." },
            { id: 169, name: "Электрическая медуза", desc: "Снаряды постоянно запускают электрические разряды в случайном направлении и всегда имеют оглушающий эффект. При стрельбе есть шанс, что персонаж оглушит сам себя." },
            { id: 170, name: "Генератор частиц", desc: "При получении урона персонаж создаёт маленькую голографическую копию, которая преследует существ и отвлекает внимание на себя." },
            { id: 171, name: "Старый компьютер", desc: "В начале каждой последующей вылазки создаёт старый терминал рядом с кораблём и даёт 3 хлама." },
            { id: 172, name: "Острый перец", desc: "Шанс выстрелить пронзающим поджигающим снарядом и поджечь самого себя. Повышает урон от горения, наносимый существам в 3 раза. Шанс зависит от удачи." },
            { id: 173, name: "Юлий Цезарь", desc: "Повышает скорострельность в 2 раза. Заменяет оружие персонажа на двойные пистолеты, направленные в разные стороны. Пистолеты стреляют по очереди." },
            { id: 174, name: "Ящик-матрёшка", desc: "Любой тип ящика при открытии получает дополнительный шанс 25% создать мини версию другого случайного типа ящика." },
            { id: 175, name: "Феромоны", desc: "Роевики и вредители не наносят урон персонажу и атакуют других существ. Урон роевиков и вредителей зависит от урона персонажа." },
            { id: 176, name: "Тайник", desc: "Добавляет шанс найти случайный ящик при добыче камня, но не больше 5 за вылазку." },
            { id: 177, name: "Окаменевшая линейка", desc: "Не даёт дальности снижаться." },
            { id: 178, name: "Окаменевший ботинок", desc: "Не даёт скорости ходьбы и бега снижаться." },
            { id: 179, name: "Окаменевшая пружина", desc: "Не даёт скорострельности снижаться." },
            { id: 180, name: "Тяжёлая базука", desc: "Повышает урон на 75%. Снижает: скорость ходьбы и бега на 20%, скорость снарядов на 30%. Снаряды плавно ускоряются и взрываются." },
            { id: 181, name: "Попкорн", desc: "Уменьшает размер снарядов в 2 раза. Снижает урон на 30%. В случайный момент снаряд может взорваться. После взрыва, снаряд увеличивается в 4 раза, а его урон повышается в 3 раза." },
            { id: 182, name: "Блуждающий астероид", desc: "В звёздной системе появляется бонусный безжизненный астероид, доступный для исследования." },
            { id: 183, name: "Водительское удостоверение", desc: "Гарантирует появление случайного вида транспорта в каждой последующей вылазке." },
            { id: 184, name: "Свеча", desc: "Не даёт появляться призракам." },
            { id: 185, name: "Ксерокс", desc: "Шанс удвоить награду, полученную из ящика. Шанс зависит от удачи." },
            { id: 186, name: "Терраформирование", desc: "После текущей вылазки меняет биом всех безжизненных астероидов на другой случайный." },
            { id: 187, name: "Сварка", desc: "Снижает дальность на 80%. Повышает скорострельность в 3 раза. Снаряды распадаются на 1-3 мини снаряда в случайном направлении и всегда имеют ослепляющий эффект." },
            { id: 188, name: "Золотая медаль", desc: "Повышает урон на 75%. Возрастает вероятность встретить элитных существ." },
            { id: 189, name: "Заминированная подошва", desc: "Рывок создаёт за персонажем мину." },
            { id: 190, name: "Фотоаппарат", desc: "Снаряды всегда имеют ослепляющий эффект. При стельбе есть шанс, что персонаж ослепит сам себя." },
            { id: 191, name: "Пипетка", desc: "При попадании по элитному существу снарядом, следующий выстрел скопирует его стихию." },
            { id: 192, name: "Заражение пустоты", desc: "Снаряды, выстреливаемые оружием гарантированно становятся антиматериальными. Каждый выстрел отнимает 20 очков здоровья. «Оно разъедает тебя изнутри»." },
            { id: 193, name: "Горящие покрышки", desc: "Транспорт сталкиваясь с существами создаёт взрывы и не теряет скорость." },
            { id: 194, name: "Сильнодействующие препараты", desc: "Снижает максимальный запас здоровья на 40%. Повышает эффективность любого лечения в 2 раза." },
            { id: 195, name: "Армагеддон", desc: "Незначительный шанс падения метеорита на месте любого взрыва, созданного персонажем или оружием. Шанс зависит от удачи." },
            { id: 196, name: "Колючая проволока", desc: "Баррикады запускают электрические разряды в ближайшие цели." },
            { id: 197, name: "Взломанная микросхема", desc: "Создаёт микросхему. Следующая активация выбора предметов позволит бесконечно использовать замены." },
            { id: 198, name: "Кровавая жатва", desc: "Увеличивает силу рывка персонажа на 50%. Во время рывка персонаж наносит существам контактный урон и восстанавливает здоровье." },
            { id: 199, name: "Золотой ключ", desc: "Повышает шанс найти золотой ящик." },
            { id: 200, name: "Уверенность", desc: "За каждое элитное существо в пределах видимости персонажа все предметы зависящие от удачи будут срабатывать чаще." },
            { id: 201, name: "Золотая микросхема", desc: "Повышает удачу на 1. Увеличивает шанс получить награду при взаимодействии со старыми терминалами." },
            { id: 202, name: "Глючная антенна", desc: "Снаряды, выстреливаемые существами в случайный момент могут зависнуть в воздухе и взорваться." },
            { id: 203, name: "Бинт", desc: "Отключает пассивную регенерацию здоровья. Отсутствие ходьбы, стрельбы и получений урона в течение 3 секунд очень быстро восстанавливает здоровье." },
            { id: 204, name: "Бумеранг", desc: "Снижает урон на 30%. Снаряды пролетают сквозь существ. Полностью пролетая весь путь снаряд отражается и летит обратно." },
            { id: 205, name: "Прикованный трофей", desc: "Повышает удачу на 5. Снижает скорость ходьбы и бега на 30%." },
            { id: 206, name: "Железный слиток", desc: "Повышает урон на 30%. Даёт 25 металла в начале каждой последующей вылазки." },
            { id: 207, name: "Охрана", desc: "Устанавливает рядом с кораблём 2 турели. Турели остаются до конца забега." },
            { id: 208, name: "Авторучка", desc: "Повышает дальность на 75%. На месте уничтоженных снарядов остаются большие лужи жидкости." },
            { id: 209, name: "Бумажный самолётик", desc: "Повышает урон на 75%. Снаряды пролетают сквозь препятствия и существ. Снаряды постоянно поворачиваются в случайных направлениях во время полёта." },
            { id: 210, name: "Слот-машина", desc: "Даёт 20 хлама. Создаёт 3 старых терминала." },
            { id: 211, name: "Рекурсия", desc: "Создаёт 1 случайный картридж. Шанс 30% при использовании картриджа создать ещё один случайный картридж." },
            { id: 212, name: "Старый дрон", desc: "Каждый добытый камень создаёт на своём месте дрон." },
            { id: 213, name: "Капельница", desc: "Повышает максимальную выносливость на 1. Ускоряет регенерацию на 75% во время бега." },
            { id: 214, name: "Турнирное копьё", desc: "Снижает дальность на 80%. Повышает урон в 3 раза. Держа в руках оружие персонаж бежит быстрее на 75%. Снаряды пролетают сквозь существ." },
            { id: 215, name: "3D принтер", desc: "Создаёт 3 случайных картриджа в начале каждой последующей вылазки." },
            { id: 216, name: "Кофе", desc: "Повышает скорость бега на 1. В каждой последующей вылазке бонус уменьшается на 0.25." },
            { id: 217, name: "Фен", desc: "Повышает урон на 75%. Снижает лимит перегрева оружия в 2 раза." },
            { id: 218, name: "Гитара", desc: "Каждый третий выстрел содержит в себе на 2 снаряда больше. «Я хочу просто взять гитару... И показать всем, какой ты никчёмный гитарист? Опозориться самому, опозорить меня!»" },
            { id: 219, name: "Счастливый билет", desc: "Старый терминал при разрушении гарантированно создаст случайную награду." },
            { id: 220, name: "Горшочек с мёдом", desc: "Каждая утилизация выбора предметов даёт 25 мёда. «Мёд - если есть, то его сразу нет!»" },
            { id: 221, name: "Карманный реактор", desc: "Незначительный шанс выстрелить мощным, отравляющим взрывным снарядом. После взрыва остаётся несколько больших лужи жидкости. Шанс зависит от удачи." },
            { id: 222, name: "Резонирующая жидкость", desc: "Лужи жидкости при контакте с существами хаотично стреляют лазерами в разные стороны." },
            { id: 223, name: "Кактус", desc: "Уничтоженное существо создаёт после себя мини-снаряды в 8 направлениях." },
            { id: 224, name: "Лягушачья лапка", desc: "Увеличивает силу рывка на 50%. Повышает максимальную выносливость на 2. «Выглядит вкусно, правда?»" },
            { id: 225, name: "Проклятая пуля", desc: "Повышает урон в 2 раза. Шанс создать враждебного призрака на месте уничтоженного снаряда." },
            { id: 226, name: "Личинка дюнного червя", desc: "Позволяет призывать дюнных червей при помощи молотка вне зависимости от биома." },
            { id: 227, name: "Святой амулет", desc: "Снижает вероятность возникновения природных бедствий на 50%." },
            { id: 228, name: "Плоский напильник", desc: "Повышает скорострельность на 0.5." },
            { id: 229, name: "Плоское долото", desc: "Повышает урон на 0.5." },
            { id: 230, name: "Весло", desc: "Снижает скорострельность на 30%. Повышает урон в 2 раза. Вместе с выстрелом персонаж создаёт 2 пронзающие атаки по бокам. Значительно повышает воздействие отдачи на персонажа и отзеркаливает её направление." },
            { id: 231, name: "Заросшая колонна", desc: "Увеличивает размер и прочность баррикад в 2 раза." },
            { id: 232, name: "Химическая реакция", desc: "Существо, находящееся под воздействием 2 и более стихий взрывается." },
            { id: 233, name: "Серная кислота", desc: "Повышает урон на 30%. Отравляющий эффект дополнительно наносит существам урон." },
            { id: 234, name: "Карманный детонатор", desc: "При получении урона персонаж создаёт мощный взрыв." },
            { id: 235, name: "Хрустальный пистолет", desc: "Повышает урон в 2 раза. При получении урона оружие перегревается." },
            { id: 236, name: "Забытая лопата", desc: "Повышает скорость добычи лазерным буром на 50%. Добавляет незначительный шанс найти микросхему при добыче камня, но не больше 1 за вылазку." },
            { id: 237, name: "Тлеющие угли", desc: "Повышает урон на 30%. Шанс поджечь случайное существо в пределах видимости персонажа." },
            { id: 238, name: "Нейроплазма", desc: "Шанс выстрелить нейроплазменным снарядом. Заставляет существо атаковать других существ. Шанс зависит от удачи." },
            { id: 239, name: "Треснувшая дискета", desc: "Генерирует пул картриджей заново. Создаёт 1 случайный картридж." },
            { id: 240, name: "Самодельная турель", desc: "Устанавливает турель на дрон доставщик. Дрон больше не может доставлять грузы." },
            { id: 241, name: "Магический посох", desc: "Снижает скорострельность на 30%. Снаряды выстреливаются в сторону ближайшей цели. К каждому снаряду могут применяться случайные эффекты." },
            { id: 242, name: "Лампа накаливания", desc: "Увеличивает размер и хитбокс снарядов на 50%. Шанс ослепить случайное существо в пределах видимости персонажа." },
            { id: 243, name: "Отравленный дротик", desc: "Повышает дальность на 50%. Шанс отравить случайное существо в пределах видимости персонажа." },
            { id: 244, name: "Сломанный зарядник", desc: "Повышает скорострельность на 30%. Шанс оглушить случайное существо в пределах видимости персонажа." },
            { id: 245, name: "Мороженое", desc: "Повышает максимальный запас здоровья на 15%. Шанс заморозить случайное существо в пределах видимости персонажа." },
            { id: 246, name: "Лист брони", desc: "Шанс 50% отразить снаряды существ. Отражённые снаряды могут наносить урон по существам." },
            { id: 247, name: "Ядро хаоса", desc: "Снаряды случайным образом могут взрываться, оставлять после себя лужи жидкости, хаотично запускать электрические разряды и мини-снаряды." },
            { id: 248, name: "Чемодан", desc: "Позволяет перенести до 5 случайных расходников с текущей на последующую вылазку." },
            { id: 249, name: "Ножницы хирурга", desc: "Уменьшает размер существ на 40%. Снижает урон и максимальный запас здоровья существ на 30%. Существа появляются по 2 за раз. Снаряды пролетают сквозь существ." },
            { id: 250, name: "Порченый гриб", desc: "Умеренно повышает все характеристики, кроме максимального запаса здоровья. Повышает урон, получаемый персонажем на 50%." },
            { id: 251, name: "Разбрызгиватель", desc: "Во время бега персонаж стреляет мини-снарядами в случайном направлении." },
            { id: 252, name: "Муравейник", desc: "Шанс создать дружественного роевика при выстреле. Шанс зависит от удачи." },
            { id: 253, name: "Железная дверь", desc: "Повышает скорость регенерации в 3 раза, пока персонаж находится рядом с кораблём." },
            { id: 254, name: "Кровавая батарейка", desc: "Батарейки повышают максимальный запас здоровья вместо щита. Создаёт 1 батарейку." },
            { id: 255, name: "Гидрант", desc: "При получении урона персонаж временно начинает хаотично стрелять мини снарядами, а перегрев оружия становится неограниченным. Эффект длится 5 сек и может быть активирован не чаще, чем раз в 10 сек." },
            { id: 256, name: "Талисман", desc: "Повышает удачу на 1. Гарантированно блокирует урон от любого источника раз в 10 секунд. «По моему, это обычная пуговица...»" },
            { id: 257, name: "Иголка", desc: "Рывок наносит персонажу 1 урон. Увеличивает силу рывка на 50%." },
            { id: 258, name: "Заряженный кубик", desc: "Батарейки дополнительно дают 1 временную замену. Создаёт 1 батарейку."},
            { id: 259, name: "Транзистор", desc: "Все батарейки, найденные в дальнейшем, заменяются случайными картриджами. Создаёт 1 случайный картридж."},
            { id: 260, name: "Колокол", desc: "При получении урона персонаж издаёт громкий звук колокола, отпугивающий существ в пределах видимости, но не чаще, чем раз в 3 сек."},
            { id: 261, name: "Золотая батарейка", desc: "Повышает удачу на 1. Каждая последующая батарейка дополнительно повышает удачу на 0.5. Создаёт 1 батарейку."},
            { id: 262, name: "Бешенство", desc: "Шанс заставить случайное существо в пределах видимости персонажа атаковать других существ."},
            { id: 263, name: "Картечь", desc: "Шанс выстрелить на 4 снаряда больше с увеличенным в 2 раза разбросом. Шанс зависит от удачи."}
        ];

        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('search');
        const countDisplay = document.getElementById('count');
        const modal = document.getElementById('modal-overlay');
        const modalName = document.getElementById('modal-name');
        const modalIcon = document.getElementById('modal-icon');
        const modalDesc = document.getElementById('modal-desc');
        const modalId = document.getElementById('modal-id');
        const closeModalBtn = document.getElementById('close-modal');

        const scale = 3;
        const tileSize = 21;
        const columns = 20;

        // Состояние печати
        let typewriterTimer = null;
        let typewriterFullText = '';
        let typewriterElement = null;
        let typewriterIndex = 0;

        function getSpritePosition(id) {
            const index = id - 1;
            const x = (index % columns) * tileSize * scale;
            const y = Math.floor(index / columns) * tileSize * scale;
            return `-${x}px -${y}px`;
        }

        function renderItems(filteredItems) {
            grid.innerHTML = '';
            countDisplay.textContent = `найдено предметов: ${filteredItems.length}`;

            if (filteredItems.length === 0) {
                grid.innerHTML = '<div class="empty-state">Ничего не найдено</div>';
                return;
            }

            filteredItems.forEach(item => {
                const icon = document.createElement('div');
                icon.className = 'item-icon';
                icon.style.backgroundPosition = getSpritePosition(item.id);
                icon.title = item.name;
                icon.onclick = () => openModal(item);
                grid.appendChild(icon);
            });
        }

        // Анимация печати текста с мигающим курсором (8 мс — быстрее)
        function typewrite(element, text, speed = 8) {
            if (typewriterTimer) {
                clearInterval(typewriterTimer);
                typewriterTimer = null;
            }
            element.innerHTML = '';

            typewriterFullText = text;
            typewriterElement = element;
            typewriterIndex = 0;

            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            cursor.textContent = '▌';
            element.appendChild(cursor);

            typewriterTimer = setInterval(() => {
                if (typewriterIndex < text.length) {
                    cursor.insertAdjacentText('beforebegin', text[typewriterIndex]);
                    typewriterIndex++;
                } else {
                    clearInterval(typewriterTimer);
                    typewriterTimer = null;
                }
            }, speed);
        }

        // Пропустить анимацию — дорисовать текст мгновенно
        function skipTypewriter() {
            if (!typewriterTimer || !typewriterElement) return;
            clearInterval(typewriterTimer);
            typewriterTimer = null;

            const remaining = typewriterFullText.slice(typewriterIndex);
            const cursor = typewriterElement.querySelector('.cursor');
            if (cursor) {
                cursor.insertAdjacentText('beforebegin', remaining);
            } else {
                typewriterElement.textContent = typewriterFullText;
            }
            typewriterIndex = typewriterFullText.length;
        }

        function openModal(item) {
            modalName.textContent = item.name;
            modalId.textContent = `ID: ${item.id}`;

            const modalScale = 6;
            const index = item.id - 1;
            const mX = (index % columns) * tileSize * modalScale;
            const mY = Math.floor(index / columns) * tileSize * modalScale;

            modalIcon.style.backgroundPosition = `-${mX}px -${mY}px`;

            const totalRows = Math.ceil(items.length / columns);
            modalIcon.style.backgroundSize = `${columns * tileSize * modalScale}px ${totalRows * tileSize * modalScale}px`;

            modal.classList.add('active');

            setTimeout(() => {
                typewrite(modalDesc, item.desc, 8);
            }, 280);
        }

        function closeModal() {
            modal.classList.remove('active');
            if (typewriterTimer) {
                clearInterval(typewriterTimer);
                typewriterTimer = null;
            }
            setTimeout(() => { modalDesc.innerHTML = ''; }, 350);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        closeModalBtn.addEventListener('click', closeModal);

        // Клик по описанию — пропустить анимацию печати
        modalDesc.addEventListener('click', skipTypewriter);

        function filterItems(query) {
            const lowerQuery = query.toLowerCase();
            return items.filter(item => {
                return item.name.toLowerCase().includes(lowerQuery) ||
                       item.desc.toLowerCase().includes(lowerQuery);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            const filtered = filterItems(query);
            renderItems(filtered);
        });

        renderItems(items);
    </script>
</body>
</html>
